[advisories]
ignore = [
    # Pre-existing ignores
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",

    # lopdf 0.36 stack-overflow via deeply nested PDFs (CVSS 7.5).
    # Fixed in lopdf >= 0.42.0, but pdf-extract 0.9.0 (pulled in transitively
    # through the optional `embeddings` / `embeddings-onnx` features via
    # embed_anything -> processors-rs -> pdf-extract) requires lopdf ^0.36,
    # so we cannot upgrade without a breaking change in that dependency chain.
    # AletheiaDB never parses untrusted PDF input directly; exposure is limited
    # to the optional embedding pipeline, which is not deployed in production.
    # Track: upgrade embed_anything when it supports lopdf >= 0.42.
    "RUSTSEC-2026-0187",

    # rsa 0.9.10 "Marvin Attack" key-recovery timing sidechannel (CVSS 5.9
    # Medium). No patched release exists upstream. Pulled in TRANSITIVELY (not a
    # direct dependency): rsa <- jsonwebtoken <- autumn-web 0.5 (via its `mcp`
    # feature) <- the unpublished `crates/autumn-spike` crate ONLY. It is ABSENT
    # from the default / CI / all-features builds, and no AletheiaDB code
    # exercises RSA private-key operations, so exposure in shipped builds is nil.
    # The `rsa` pull originates in the upstream `autumn-web 0.5` crate, so we
    # cannot drop the feature from our own Cargo.toml; the durable fix is the
    # upstream bump to autumn 0.6.0 (tracked via autumn#1828). This ignore is the
    # interim unblock. Mirrors the lopdf RUSTSEC-2026-0187 precedent above.
    "RUSTSEC-2023-0071",

    # h2 "unbounded empty DATA frames" (low severity, DoS). The h2 0.4 lockfile
    # instance is PATCHED (bumped to 0.4.16); this ignore covers only the
    # remaining h2 0.3.27 instance, for which NO patched 0.3 release exists.
    # Transitive-only, and only when optional features are enabled. Every
    # remaining route ends at aws-smithy-http-client's `hyper-014` feature
    # (dep:h2-0-3 / dep:hyper-0-14):
    #   (a) `encryption-aws-kms` -> `aws-sdk-kms/test-util` (required by the
    #       aws-smithy-mocks Decrypt success-path test, see the feature's
    #       comment in Cargo.toml) -> aws-smithy-runtime `test-util` /
    #       `legacy-test-util` -> `connector-hyper-0-14-x` -> `hyper-014`;
    #   (b) `embeddings` -> embed_anything -> aws-sdk-s3 declared WITH default
    #       features (upstream, not ours to change) -> aws-sdk-s3's default
    #       `rustls` -> aws-smithy-runtime's legacy `tls-rustls` -> `hyper-014`.
    # This PR removed the third, redundant enabler: our aws-sdk-kms declaration
    # now uses default-features=false with the modern `default-https-client`
    # (hyper-1.x / h2-0.4, rustls-aws-lc TLS) instead of the default `rustls`
    # (legacy `tls-rustls`). Latest smithy-runtime (1.14.0) still chains
    # test-util through hyper-014, so (a) cannot be fixed from our side yet.
    # In every case the legacy hyper-0.14 connector is compiled but never
    # instantiated by our code (the default connector is hyper-1.x/h2-0.4),
    # and h2 0.3 is absent entirely from default and CI builds — shipped-build
    # exposure is nil. Durable fix: smithy stack drops hyper-014 from
    # legacy-test-util, and embed_anything drops aws-sdk-s3 default features;
    # re-check on the next aws-smithy / embed_anything refresh and remove this
    # ignore then (tracked via issue #3807).
    "RUSTSEC-2026-0258",
]
